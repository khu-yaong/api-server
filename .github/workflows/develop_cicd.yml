name: Java Build and Deploy on develop

on:
  push:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4
      # JDK 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # application.yaml 생성
      - name: Create application.yaml
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.APPLICATION_YAML }}" > src/main/resources/application.yaml
          echo "${{ secrets.APPLICATION_AUTH_YAML }}" > src/main/resources/application-auth.yaml
          echo "${{ secrets.APPLICATION_DEV_YAML }}" > src/main/resources/application-dev.yaml

      # Gradle 빌드
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test
          chmod +x ./gradlew

      # Dcoker Hub 로그인
      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Docker 이미지 빌드
      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/yaong:latest .
      # Docker 이미지 푸시
      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/yaong:latest

      # EC2에 배포
      - name: Deploy to EC2
        run: |
          ssh -i ${{ secrets.SSH_PRIVATE_KEY }} ec2-user@${{ secrets.EC2_PUBLIC_IP }} << EOF
          docker pull ${{ secrets.DOCKER_USERNAME }}/yaong:latest
          docker stop yaong || true
          docker rm yaong || true
          docker run -d -p 8080:8080 --name yaong ${{ secrets.DOCKER_USERNAME }}/yaong:latest
          EOF


